        let userLocation = null;

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; 
        }

        function requestLocation() {
            document.getElementById('view-splash').classList.remove('hidden');
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation = {
                            lat: position.coords.latitude,
                            lon: position.coords.longitude
                        };
                        findNearestAndRender();
                    },
                    (error) => {
                        console.warn("Location error:", error);
                        showToast("Location access denied. Please select an office from the map.");
                        showView('map');
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            } else {
                showToast("Geolocation is not supported by your browser.");
                showView('map');
            }
        }

        function findNearestAndRender() {
            if (!userLocation) return;
            
            offices.forEach(office => {
                office.distanceToUser = calculateDistance(userLocation.lat, userLocation.lon, office.lat, office.lon);
            });

            offices.sort((a, b) => a.distanceToUser - b.distanceToUser);
            currentNearestOffice = offices[0];
            
            // If the nearest office is further than 2500km, fallback to map
            if (currentNearestOffice.distanceToUser > 2500) {
                showToast("No office found near your location. Explore our global map.");
                showView('map');
            } else {
                renderProfile(currentNearestOffice);
                showView('profile');
            }
        }

        function initOrUpdateMap() {
            if (!globalMap) {
                // Initialize map centered on Europe/Turkey
                globalMap = L.map('map-container', { zoomControl: false }).setView([41.0082, 28.9784], 4);
                
                // Remove Leaflet prefix (which includes the flag) for corporate neutrality
                globalMap.attributionControl.setPrefix(false);
                
                // Add OpenStreetMap Tile Layer (Completely Free, No API Key Required)
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap',
                    maxZoom: 19
                }).addTo(globalMap);

                L.control.zoom({ position: 'bottomright' }).addTo(globalMap);

                // Plot offices
                offices.forEach(office => {
                    if (office.lat !== 0 && office.lon !== 0) {
                        const customIcon = L.divIcon({
                            className: 'bg-transparent',
                            html: `<div class="w-10 h-10 bg-acibadem-blue text-white rounded-full flex items-center justify-center shadow-xl border-[3px] border-white transition-transform transform hover:scale-110"><i class="ph-fill ph-map-pin text-2xl"></i></div>`,
                            iconSize: [40, 40],
                            iconAnchor: [20, 40]
                        });
                        
                        const marker = L.marker([office.lat, office.lon], { icon: customIcon }).addTo(globalMap);
                        
                        marker.bindTooltip(`
                            <div class="text-center w-max min-w-[120px]">
                                <div class="font-bold text-[14px] text-acibadem-blue mb-1">${office.displayName}</div>
                                <div class="text-[11px] text-gray-500">${office.country}</div>
                                <div class="mt-2 text-[10px] font-semibold text-acibadem-blue bg-blue-50 py-1 rounded-md">Tap to view</div>
                            </div>
                        `, {
                            direction: 'top',
                            offset: [0, -40],
                            className: 'custom-tooltip'
                        });

                        marker.on('click', () => {
                            renderProfile(office);
                            showView('profile');
                        });
                    }
                });
            }

            // Fix leaflet rendering bug inside hidden containers
            setTimeout(() => { globalMap.invalidateSize(); }, 300);
        }

        function renderProfile(office) {
            const profileContainer = document.getElementById('view-profile');
            
            // Find other offices in the same country
            const relatedOffices = offices.filter(o => o.country === office.country && o.id !== office.id);
            
            let relatedHTML = '';
            if (relatedOffices.length > 0) {
                relatedHTML = `
                    <div class="mt-8 mb-4 px-5 md:px-0">
                        <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-4">Other offices in ${office.country}</h3>
                        <div class="flex overflow-x-auto no-scrollbar gap-4 pb-4 md:pb-6 -mx-5 px-5 md:mx-0 md:px-0">
                            ${relatedOffices.map(ro => `
                                <div onclick="switchToOffice('${ro.id}')" class="min-w-[200px] bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex-shrink-0 cursor-pointer active:scale-95 hover:shadow-md transition-all group">
                                    <div class="w-10 h-10 rounded-full bg-acibadem-light text-acibadem-blue flex items-center justify-center mb-3 group-hover:bg-acibadem-blue group-hover:text-white transition-colors">
                                        <i class="ph-fill ph-buildings text-xl"></i>
                                    </div>
                                    <h4 class="font-semibold text-acibadem-dark text-sm mb-1 line-clamp-1">${ro.displayName}</h4>
                                    <p class="text-xs text-gray-500 line-clamp-2">${ro.address}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            profileContainer.innerHTML = `
                <!-- Image Header with Gradient Overlay -->
                <div class="relative w-full h-72 md:h-[40vh] shrink-0">
                    <img src="${defaultImage}" alt="${office.displayName}" class="w-full h-full object-cover">
                    <!-- Overlay to make text readable -->
                    <div class="absolute inset-0 bg-gradient-to-t from-acibadem-dark via-acibadem-dark/60 to-transparent"></div>
                    
                    <!-- Floating Text Info inside Image -->
                    <div class="absolute bottom-16 md:bottom-20 left-5 right-5 md:left-10 md:right-10 text-white max-w-5xl mx-auto w-full">
                        <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-white/20 backdrop-blur-sm text-[11px] font-semibold mb-3 border border-white/20">
                            <i class="ph-fill ph-map-pin"></i> ${office.country}
                        </div>
                        <h2 class="text-2xl md:text-4xl font-bold leading-tight mb-2 shadow-sm">${office.displayName}</h2>
                        <p class="text-sm md:text-base text-gray-200 opacity-90 line-clamp-2 font-light flex items-start gap-2">
                            ${office.address}
                        </p>
                    </div>
                </div>

                <!-- Desktop Centered Content Wrapper -->
                <div class="max-w-3xl mx-auto w-full pb-10">
                    <!-- Floating C2A Action Buttons (Overlapping Image) -->
                    <div class="grid grid-cols-4 gap-3 px-5 md:px-0 -mt-6 md:-mt-8 relative z-10">
                        
                        <a href="tel:${office.phone.split(';')[0]}" class="group flex flex-col items-center justify-center bg-white rounded-2xl p-3 shadow-lg border border-gray-50 active:scale-95 hover:shadow-xl hover:-translate-y-1 transition-all text-acibadem-blue">
                            <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center mb-1.5 group-hover:bg-acibadem-blue group-hover:text-white transition-colors"><i class="ph-fill ph-phone text-xl"></i></div>
                            <span class="text-[10px] font-semibold text-gray-700">Call</span>
                        </a>
                        
                        <a href="https://wa.me/${office.phone.split(';')[0].replace(/[^0-9]/g, '')}" target="_blank" class="group flex flex-col items-center justify-center bg-white rounded-2xl p-3 shadow-lg border border-gray-50 active:scale-95 hover:shadow-xl hover:-translate-y-1 transition-all text-[#25D366]">
                            <div class="w-10 h-10 rounded-full bg-green-50 flex items-center justify-center mb-1.5 group-hover:bg-[#25D366] group-hover:text-white transition-colors"><i class="ph-fill ph-whatsapp-logo text-xl"></i></div>
                            <span class="text-[10px] font-semibold text-gray-700">WhatsApp</span>
                        </a>
                        
                        <a href="mailto:${office.email}" class="group flex flex-col items-center justify-center bg-white rounded-2xl p-3 shadow-lg border border-gray-50 active:scale-95 hover:shadow-xl hover:-translate-y-1 transition-all text-acibadem-blue">
                            <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center mb-1.5 group-hover:bg-acibadem-blue group-hover:text-white transition-colors"><i class="ph-fill ph-envelope-simple text-xl"></i></div>
                            <span class="text-[10px] font-semibold text-gray-700">Email</span>
                        </a>
                        
                        <a href="https://maps.google.com/?q=${encodeURIComponent(office.address)}" target="_blank" class="group flex flex-col items-center justify-center bg-white rounded-2xl p-3 shadow-lg border border-gray-50 active:scale-95 hover:shadow-xl hover:-translate-y-1 transition-all text-acibadem-blue">
                            <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center mb-1.5 group-hover:bg-acibadem-blue group-hover:text-white transition-colors"><i class="ph-fill ph-navigation-arrow text-xl"></i></div>
                            <span class="text-[10px] font-semibold text-gray-700">Route</span>
                        </a>
                    </div>

                <!-- Contact Details List -->
                <div class="mt-8 px-5 md:px-0">
                    <div class="bg-white rounded-3xl p-5 md:p-6 shadow-sm border border-gray-100 flex flex-col gap-5 md:gap-6">
                        <div class="flex items-start gap-4">
                            <div class="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center shrink-0 text-gray-400">
                                <i class="ph-fill ph-map-pin text-xl"></i>
                            </div>
                            <div>
                                <p class="text-[11px] font-bold text-gray-400 uppercase mb-0.5">Address</p>
                                <p class="text-sm md:text-base text-acibadem-dark font-medium leading-relaxed">${office.address}</p>
                            </div>
                        </div>
                        <div class="h-px w-full bg-gray-100"></div>
                        <div class="flex items-start gap-4">
                            <div class="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center shrink-0 text-gray-400">
                                <i class="ph-fill ph-phone text-xl"></i>
                            </div>
                            <div>
                                <p class="text-[11px] font-bold text-gray-400 uppercase mb-0.5">Phone</p>
                                <p class="text-sm md:text-base text-acibadem-dark font-medium">${office.phone.replace(/;/g, '<br>')}</p>
                            </div>
                        </div>
                        <div class="h-px w-full bg-gray-100"></div>
                        <div class="flex items-start gap-4">
                            <div class="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center shrink-0 text-gray-400">
                                <i class="ph-fill ph-envelope-simple text-xl"></i>
                            </div>
                            <div>
                                <p class="text-[11px] font-bold text-gray-400 uppercase mb-0.5">Email</p>
                                <p class="text-sm md:text-base text-acibadem-dark font-medium">${office.email}</p>
                            </div>
                        </div>
                    </div>
                </div>

                ${relatedHTML}
                
                <!-- View All Offices Button -->
                <div class="mt-8 mb-6 px-5 md:px-0">
                    <button onclick="showView('list')" class="w-full bg-white hover:bg-gray-50 text-acibadem-blue border-2 border-gray-100 rounded-2xl py-4 font-bold text-[15px] flex items-center justify-center gap-2 shadow-sm active:scale-95 transition-all">
                        <i class="ph-bold ph-globe-hemisphere-west text-xl"></i> View All Global Offices
                    </button>
                </div>

                </div> <!-- End Desktop Centered Wrapper -->
                <div class="h-10"></div>
            `;
        }

        const countryCodes = {
            "Albania": "al", "Algeria": "dz", "Austria": "at", "Azerbaijan": "az",
            "Belgium": "be", "Bosnia and Herzegovina": "ba", "Bulgaria": "bg",
            "Cameroon": "cm", "Cote d’Ivoire": "ci", "Croatia": "hr", "France": "fr",
            "Georgia": "ge", "Germany": "de", "Iraq": "iq", "Kazakhstan": "kz",
            "Kosovo": "xk", "Kuwait": "kw", "Kyrgyzstan": "kg", "Moldova": "md",
            "Montenegro": "me", "North Macedonia": "mk", "Romania": "ro",
            "Russia": "ru", "Serbia": "rs", "Slovenia": "si", "Spain": "es",
            "Tajikistan": "tj", "Uganda": "ug", "Ukraine": "ua", "United Kingdom": "gb",
            "Uzbekistan": "uz"
        };

        function getFlagImg(countryName) {
            const code = countryCodes[countryName];
            if (code) {
                return `<img src="https://flagcdn.com/w40/${code}.png" alt="${countryName}" class="w-6 h-4.5 object-cover rounded shadow-[0_0_3px_rgba(0,0,0,0.2)]">`;
            }
            return `<i class="ph-fill ph-flag text-gray-400"></i>`;
        }

        function renderListView() {
            const listContainer = document.getElementById('list-content');
            const selectContainer = document.getElementById('country-select');
            
            // Group by country
            const grouped = {};
            offices.forEach(o => {
                if (!grouped[o.country]) grouped[o.country] = [];
                grouped[o.country].push(o);
            });

            const sortedCountries = Object.keys(grouped).sort();
            
            // Populate Select
            selectContainer.innerHTML = '<option value="">Jump to a country...</option>';
            sortedCountries.forEach(country => {
                selectContainer.innerHTML += `<option value="${country.replace(/\s+/g, '-')}">${country}</option>`;
            });

            // Populate List
            let html = '';
            sortedCountries.forEach(country => {
                const countryId = country.replace(/\s+/g, '-');
                html += `
                    <div id="country-${countryId}" class="country-group scroll-mt-24 pt-2 break-inside-avoid mb-8 transition-colors duration-500 -mx-3 px-3 py-2 rounded-2xl">
                        <h3 class="text-lg font-bold text-acibadem-blue mb-4 flex items-center gap-2 border-b border-gray-200 pb-2">
                            ${getFlagImg(country)} ${country}
                            <span class="ml-auto text-xs font-semibold bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full">${grouped[country].length}</span>
                        </h3>
                        <div class="flex flex-col gap-3">
                            ${grouped[country].map(o => `
                                <div onclick="switchToOffice('${o.id}')" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4 cursor-pointer active:scale-95 transition-transform hover:shadow-md">
                                    <div class="w-12 h-12 rounded-full bg-acibadem-light text-acibadem-blue flex items-center justify-center shrink-0">
                                        <i class="ph-fill ph-buildings text-2xl"></i>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <h4 class="font-bold text-acibadem-dark text-sm truncate">${o.displayName}</h4>
                                        <p class="text-xs text-gray-500 truncate mt-0.5">${o.address}</p>
                                    </div>
                                    <div class="text-gray-300">
                                        <i class="ph-bold ph-caret-right"></i>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        function scrollToCountry(countryId) {
            if(!countryId) return;
            const element = document.getElementById(`country-${countryId}`);
            const contentArea = document.getElementById('content-area');
            
            // Remove highlight from all countries
            document.querySelectorAll('.country-group').forEach(el => {
                el.classList.remove('bg-orange-50', 'ring-1', 'ring-orange-200', 'shadow-sm');
            });

            if (element) {
                // Calculate scroll position accounting for the sticky select if necessary
                const topPos = element.offsetTop - 80; 
                contentArea.scrollTo({ top: topPos, behavior: 'smooth' });
                
                // Add highlight to selected country
                element.classList.add('bg-orange-50', 'ring-1', 'ring-orange-200', 'shadow-sm');
            }
        }

        function switchToOffice(id) {
            const target = offices.find(o => o.id === id);
            if (target) {
                renderProfile(target);
                showView('profile');
            }
        }

        function showView(viewId) {
            // Hide all
            document.getElementById('view-splash').classList.add('hidden');
            document.getElementById('view-profile').classList.add('hidden');
            document.getElementById('view-list').classList.add('hidden');
            document.getElementById('view-map').classList.add('hidden');
            
            // Header List Button Logic
            const headerListBtn = document.getElementById('header-list-btn');
            if(viewId === 'profile') {
                headerListBtn.classList.remove('hidden');
            } else {
                headerListBtn.classList.add('hidden');
            }

            // Reset Nav Icons
            document.getElementById('nav-btn-profile').className = 'flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-acibadem-blue transition-colors relative';
            const viewElement = document.getElementById(`view-${viewId}`);
            viewElement.classList.remove('hidden');
            viewElement.classList.add('fade-in');
            
            // Scroll logic & Nav active state
            if(viewId !== 'map') { document.getElementById('content-area').scrollTop = 0; }

            if (viewId === 'profile') {
                const btn = document.getElementById('nav-btn-profile');
                btn.className = 'flex flex-col items-center justify-center w-full h-full text-acibadem-blue transition-colors';
                btn.querySelector('i').classList.replace('ph', 'ph-fill');
            } else if (viewId === 'list') {
                renderListView();
                const btn = document.getElementById('nav-btn-list');
                btn.className = 'flex flex-col items-center justify-center w-full h-full text-acibadem-blue transition-colors';
                btn.querySelector('i').classList.replace('ph', 'ph-fill');
            } else if (viewId === 'map') {
                initOrUpdateMap();
                const btn = document.getElementById('nav-btn-map');
                btn.className = 'flex flex-col items-center justify-center w-full h-full text-acibadem-blue transition-colors';
                btn.querySelector('i').classList.replace('ph', 'ph-fill');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // Initialize App
        window.onload = () => {
            requestLocation();
        };
    </script>
</body>
</html>
